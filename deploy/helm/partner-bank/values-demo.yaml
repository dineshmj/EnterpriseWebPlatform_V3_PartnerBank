# ┌─ :: ARCHITECTURE :: The quarterly cloud demo (short-lived, torn down after each run) ─────────
# │ Why : The demo runs EWP and its Partner Bank side by side, in one cluster but in their own
# │       namespaces - two organisations that meet only through the Gateway.
# │ How : Only what differs from values.yaml. The values marked <set by the pipeline> come from
# │       Terraform's outputs at install time (--set), never committed. The host names match
# │       EWP's values-demo.yaml (global.partnerBank).
# │ Ref : doc/Kubernetes.md
# └────────────────────────────────────────────────────────────────────────────────────────────────

global:
  # <set by the pipeline>: --set global.domain=... --set global.image.tag=main, every image's
  # digest (global.image.digests) and EWP's callback (global.ewp.redirectUris)
  domain: demo.ewp.example
  image:
    tag: "0000000000000000000000000000000000000000"

  gateway:
    parentRefs:
      - name: ewp-gateway
        namespace: gateway-system
    # The browser ports get a public certificate at the Gateway (EWP's environment: Let's
    # Encrypt); the Gateway checks the pods against the demo PKI's root (ConfigMap made by the
    # environment from Key Vault).
    terminateBrowserPorts: true
    backendCaConfigMap: partner-bank-ca

  # The public CA of the Gateway's certificate, for the deployables' calls to their own
  # authorization server's issuer address (ConfigMap made by the environment).
  backchannelTrustRoots:
    configMap: partner-bank-backchannel-roots
    keys: [letsencrypt-root-x1.pem, letsencrypt-root-x2.pem]