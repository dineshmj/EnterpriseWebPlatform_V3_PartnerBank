# ┌─ :: ARCHITECTURE + SECURITY :: Container images: built, checked and published by CI only ──────
# │ Why : An image that runs in an environment must come from a known commit through the same
# │       checks every time - never from a developer's machine. A vulnerable image, or one that
# │       does not start locked down, must not reach the registry at all.
# │ How : Per image: lint the Dockerfile (hadolint) -> build -> scan the built image (Trivy:
# │       vulnerabilities with a fix and any secret; HIGH / CRITICAL fails the job; the report
# │       goes to the run summary) -> start it with a throw-away PKI, read-only and non-root, and
# │       make one TLS request -> only then, on main, push to GHCR with an SBOM and BuildKit's
# │       SLSA provenance attached. Tags are the full commit SHA (what a deployment pins) and the
# │       branch name. Actions are pinned to commit SHAs (a moved tag cannot change what runs
# │       here); Dependabot (.github/dependabot.yml) proposes the updates.
# │ Ref : doc/Containers.md | OWASP A06, A08 | SLSA Build L2 | CIS Docker Benchmark 4.1, 4.10
# └────────────────────────────────────────────────────────────────────────────────────────────────
name: Container images

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.dockerignore'
      - '.github/workflows/container-images.yml'
      - '.github/container-images.json'
      - '.github/scripts/start-check.sh'
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - '.dockerignore'
      - '.github/workflows/container-images.yml'
      - '.github/container-images.json'
      - '.github/scripts/start-check.sh'
  workflow_dispatch:

# SEC: least privilege by default; the job below asks for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Publish only from main (a push or a manual run), never from a pull request.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # ┌─ ARCH + PERF ──────────────────────────────────────────────────────────────────────────────────
  # │ Only what a commit changed is built: .github/container-images.json lists each image with the
  # │ folders it is built from (its project and PartnerBank.Security). An image builds when one of
  # │ its folders changed; a change to the build itself (this workflow, the manifest, the start
  # │ check, .dockerignore, Directory.Build.props) - or a manual run - builds them all.
  # └────────────────────────────────────────────────────────────────────────────────────────────────
  changes:
    name: Which images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick the images to build
        id: pick
        # SEC: event values reach the script as environment variables, never pasted into it.
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=""
          case "$EVENT" in
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
          esac
          all=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            all=false
            git diff --name-only "$base" HEAD > changed.txt
            if grep -q -x -E 'Directory\.Build\.props|\.dockerignore|\.github/workflows/container-images\.yml|\.github/container-images\.json|\.github/scripts/start-check\.sh' changed.txt; then
              all=true
            fi
          fi
          if [ "$all" = true ]; then
            matrix=$(jq -c '{include: [.images[] | {image, dockerfile, check}]}' .github/container-images.json)
          else
            matrix=$(jq -c --rawfile changed changed.txt '
              ($changed | split("\n") | map(select(length > 0))) as $files
              | {include: [.images[]
                  | select([.paths[] as $p | $files[] | select(startswith($p))] | length > 0)
                  | {image, dockerfile, check}]}' .github/container-images.json)
          fi
          count=$(jq '.include | length' <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Images to build: $count (all: $all)"
            jq -r '.include[].image | "- " + .' <<< "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push to GHCR
    strategy:
      fail-fast: false
      # The images in .github/container-images.json whose folders this commit changed.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (not published yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # ┌─ SEC ────────────────────────────────────────────────────────────────────────────────────
      # │ The gate: a HIGH or CRITICAL vulnerability that has a fix, or any secret found in a
      # │ layer, stops the job before anything is published.
      # └──────────────────────────────────────────────────────────────────────────────────────────
      - name: Scan the image
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-report.txt

      # ┌─ OBS ────────────────────────────────────────────────────────────────────────────────────
      # │ The scan result on the run's summary page, passed or failed - readable without opening
      # │ the job log. Trivy prints only the findings it gates on (HIGH / CRITICAL with a fix,
      # │ secrets), so a passing image shows its scanned targets with zero counts.
      # └──────────────────────────────────────────────────────────────────────────────────────────
      - name: Scan result to the summary
        if: always() && steps.scan.outcome != 'skipped'
        env:
          IMAGE: ${{ matrix.image }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          {
            echo "### $IMAGE - scan $OUTCOME"
            echo '<details><summary>Trivy report</summary>'
            echo
            echo '```text'
            if [ -s trivy-report.txt ]; then cat trivy-report.txt; else echo '(no report written)'; fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s trivy-report.txt ]; then cat trivy-report.txt; fi

      # ┌─ RESIL ──────────────────────────────────────────────────────────────────────────────────
      # │ The image starts as it would in an environment - non-root, read-only, no capabilities,
      # │ a mounted PKI (throw-away) and /data volume - and answers one request over TLS. A
      # │ missing native library, an unwritable folder or a TLS mistake fails here, not at the
      # │ first deployment.
      # └──────────────────────────────────────────────────────────────────────────────────────────
      - name: Start check
        # SEC: the check's settings reach the script as environment variables, never pasted into it.
        env:
          IMAGE: ${{ matrix.image }}:scan
          CHECK: ${{ toJSON(matrix.check) }}
        run: bash .github/scripts/start-check.sh

      - name: Sign in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the scanned build, so the layers come from the cache: what is pushed is
      # what was scanned.
      - name: Publish with SBOM and provenance
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}